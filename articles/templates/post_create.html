{% extends "layout.html" %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm text-slate-400 mb-8">
        <a href="/" class="hover:text-slate-200 transition-colors">Главная</a>
        <span class="text-slate-600">/</span>
        <a href="{% url 'articles:home' %}" class="hover:text-slate-200 transition-colors">Блог</a>
        <span class="text-slate-600">/</span>
        <span class="text-slate-500">Новый пост</span>
    </nav>

    <h1 class="text-3xl font-semibold text-slate-100 leading-snug mb-8">
        Новый пост
    </h1>

    <form method="post" action="{% url 'articles:post_create' %}"
          novalidate
          enctype="multipart/form-data"
          class="flex flex-col gap-6">
        {% csrf_token %}

        {% for field in form %}
        <div class="flex flex-col gap-2">
            <label class="text-sm text-slate-400">{{ field.label }}</label>
            {{ field }}

        </div>
        {% endfor %}

        <div class="flex items-center gap-3 pt-2 border-t border-white/[0.08]">
            <button type="submit"
                    class="bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium
                           px-6 py-2.5 rounded-lg transition-colors">
                Опубликовать
            </button>
            <a href="{% url 'articles:home' %}"
               class="text-sm text-slate-400 hover:text-slate-200 border border-white/10
                      hover:border-white/20 px-6 py-2.5 rounded-lg transition-colors">
                Отмена
            </a>
        </div>

    </form>
</div>
{% endblock %}
