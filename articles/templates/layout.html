{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="min-h-screen bg-slate-900">

<nav class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur-md border-b border-white/10">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3 flex-shrink-0">
            <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <span class="font-medium text-slate-100 text-sm">Blog</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="{% url 'articles:home' %}"
               class="text-sm text-slate-400 hover:text-slate-200 px-3 py-2 rounded-lg hover:bg-white/5 transition-colors">Блог</a>
            <a href="#"
               class="text-sm text-slate-400 hover:text-slate-200 px-3 py-2 rounded-lg hover:bg-white/5 transition-colors">Курсы</a>
            <a href="{% url 'articles:post_create' %}"
               class="text-sm font-medium text-indigo-400 border border-indigo-500/50 hover:bg-indigo-500 hover:text-white px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Новый пост
            </a>
            {% if not user.is_authenticated %}
            <a href="{% url 'users:sign_in' %}"
               class="text-sm font-medium bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg transition-colors">Войти</a>
            {% else %}
            <a href="{% url 'users:sign_out' %}"
               class="text-sm font-medium bg-red-500 hover:bg-red-400
          text-white px-4 py-2 rounded-lg transition-colors">
                Выйти
            </a>
            {% endif %}
        </div>
    </div>
</nav>


{% block content %}
{% endblock %}
{% block script %}
{% endblock %}

</body>
</html>
