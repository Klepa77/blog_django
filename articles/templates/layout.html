{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="min-h-screen bg-slate-900">

<nav class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur-md border-b border-white/10">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3 flex-shrink-0">
            <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <span class="font-medium text-slate-100 text-sm">Blog</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="{% url 'articles:home' %}"
               class="text-sm text-slate-400 hover:text-slate-200 px-3 py-2 rounded-lg hover:bg-white/5 transition-colors">Блог</a>
            <a href="{% url 'articles:home' %}?favorite=1"
               class="text-sm text-slate-400 hover:text-slate-200 px-3 py-2 rounded-lg hover:bg-white/5 transition-colors">Избранное</a>
            <a href="{% url 'articles:post_create' %}"
               class="text-sm font-medium text-indigo-400 border border-indigo-500/50 hover:bg-indigo-500 hover:text-white px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Новый пост
            </a>
            {% if not user.is_authenticated %}
            <a href="{% url 'users:sign_in' %}"
               class="text-sm font-medium bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg transition-colors">Войти</a>
            {% else %}
<div class="relative" id="user-menu">
    <button type="button" id="user-menu-btn"
            class="flex items-center gap-2 pl-1.5 pr-2.5 py-1.5 rounded-lg
                   border border-white/10 hover:bg-white/5 transition-colors"
            aria-haspopup="true" aria-expanded="false">
        {% if user.profile.avatar %}
        <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}"
             class="w-7 h-7 rounded-full object-cover">
        {% else %}
        <div class="w-7 h-7 rounded-full bg-indigo-500/20 text-indigo-400
                    flex items-center justify-center text-xs font-medium">
            {{ user.username|slice:":2"|upper }}
        </div>
        {% endif %}
        <span class="text-sm text-slate-200 max-w-[120px] truncate">{{ user.username }}</span>
        <svg class="user-menu-chevron w-4 h-4 text-slate-400 transition-transform duration-200"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>

    <div id="user-menu-dropdown"
         class="hidden absolute right-0 mt-2 w-56 origin-top-right
                bg-slate-800 border border-white/[0.08] rounded-xl shadow-xl py-1.5">

        <div class="px-3.5 py-2 border-b border-white/[0.06] mb-1">
            <p class="text-sm font-medium text-slate-200 truncate">{{ user.username }}</p>
            {% if user.email %}
            <p class="text-xs text-slate-500 truncate">{{ user.email }}</p>
            {% endif %}
        </div>

        <a href="{% url 'articles:show_hidden_authors' %}"
           class="flex items-center gap-2.5 px-3.5 py-2 text-sm text-slate-300
                  hover:bg-white/5 hover:text-slate-100 transition-colors">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
            Скрытые авторы
        </a>

        <div class="my-1 border-t border-white/[0.06]"></div>

        <a href="{% url 'users:sign_out' %}"
           class="flex items-center gap-2.5 px-3.5 py-2 text-sm text-red-400
                  hover:bg-red-500/10 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Выйти
        </a>
    </div>
</div>
{% endif %}
        </div>
    </div>
</nav>


{% block content %}
{% endblock %}
{% block script %}
{% endblock %}
<script>
    (() => {
        const btn = document.getElementById('user-menu-btn')
        const dropdown = document.getElementById('user-menu-dropdown')
        if (!btn || !dropdown) return

        const chevron = btn.querySelector('.user-menu-chevron')

        const setOpen = (open) => {
            dropdown.classList.toggle('hidden', !open)
            chevron.classList.toggle('rotate-180', open)
            btn.setAttribute('aria-expanded', open)
        }

        btn.addEventListener('click', (e) => {
            e.stopPropagation()
            setOpen(dropdown.classList.contains('hidden'))
        })

        document.addEventListener('click', (e) => {
            if (!document.getElementById('user-menu').contains(e.target)) setOpen(false)
        })

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setOpen(false)
        })
    })()
</script>
</body>
</html>
