{% extends "layout.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-slate-800/60 border border-white/[0.08]
                rounded-2xl p-6 backdrop-blur-sm">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl
                        bg-indigo-500/10 border border-indigo-500/20 mb-4">
                <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>

            <h1 class="text-2xl font-semibold text-slate-100 mb-2">Проверьте почту</h1>
            <p class="text-slate-400 text-sm leading-relaxed">
                Если аккаунт с таким email существует, мы отправили на него
                ссылку для сброса пароля.
            </p>

            <div class="mt-5 pt-5 border-t border-white/[0.08] text-sm text-slate-400">
                Не пришло письмо? Проверьте «Спам» или
                <a href="{% url 'users:password_reset' %}"
                   class="text-indigo-400 hover:text-indigo-300">отправьте ещё раз</a>.
            </div>
        </div>
    </div>
</div>
{% endblock %}
