{% extends "layout.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">

    <div class="max-w-xl w-full text-center">

        <div class="inline-flex items-center justify-center
                    w-20 h-20 rounded-3xl
                    bg-red-500/10 border border-red-500/20 mb-6">

            <svg class="w-10 h-10 text-red-400"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 9v2m0 4h.01M5.07 19H18.93
                         a2 2 0 001.74-3L13.74 4
                         a2 2 0 00-3.48 0L3.33 16
                         a2 2 0 001.74 3z"/>
            </svg>

        </div>

        <p class="text-red-400 font-medium tracking-wider text-sm mb-2">
            ERROR 403
        </p>

        <h1 class="text-4xl font-semibold text-slate-100 mb-4">
            Доступ запрещён
        </h1>

        <p class="text-slate-400 leading-relaxed mb-8">
            У вас нет прав для выполнения этого действия.
            Возможно, вы пытаетесь изменить или удалить статью,
            которая принадлежит другому пользователю.
        </p>

        <div class="flex justify-center gap-3 flex-wrap">

            <a href="{% url 'articles:home' %}"
               class="px-5 py-2.5 rounded-xl
                      border border-indigo-500/30
                      text-indigo-400
                      hover:bg-indigo-500/10
                      transition-colors">

                На главную
            </a>

            <button onclick="history.back()"
                    class="px-5 py-2.5 rounded-xl
                           border border-white/10
                           text-slate-300
                           hover:bg-white/5
                           transition-colors">

                Назад
            </button>

        </div>

    </div>

</div>
{% endblock %}
